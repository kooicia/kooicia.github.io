<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to Somewhere Today</title>
<meta http-equiv="refresh" content="0; url=/somewheretoday/">
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('waypoint')).forEach(k => caches.delete(k)));
  location.replace('/somewheretoday/');
</script>
</head>
<body style="font:16px -apple-system,sans-serif;padding:32px">This app has moved to <a href="/somewheretoday/">Somewhere Today</a>.</body>
</html>
